name: Maintain GoonFx main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  maintain:
    if: ${{ !contains(github.event.head_commit.message, '[auto-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout goonfx
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fix ActiveSymbol display_name references
        run: |
          sed -i 's/trading\.activeSymbol?\.display_name/trading.activeSymbol?.underlying_symbol/g' components/goonfx-terminal.tsx
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/goonfx-terminal.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix ActiveSymbol references [auto-fix]'
          git push origin HEAD:main
